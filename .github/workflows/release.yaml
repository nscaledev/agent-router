name: Release
on:
  push:
    tags:
      # Namespaced so the upstream v* tags the fork carries never publish unpatched code to Harbor.
      - "nscale/v*" # Ex. nscale/v1.2.0-nscale.1

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${REF_NAME#nscale/}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-nscale\.[0-9]+$ ]] || {
            echo "::error::tag $REF_NAME is not nscale/v<major>.<minor>.<patch>-nscale.<n>"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  docker_push:
    name: Push Docker Images
    needs: [version]
    permissions:
      contents: read
    uses: ./.github/workflows/docker_build_job.yaml
    with:
      tag: ${{ needs.version.outputs.tag }}
    secrets: inherit

  release:
    needs: [version, docker_push]
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create requires contents:write
    env:
      # Images and charts live in different Harbor projects.
      IMAGE_REGISTRY: registry.nscale.com/envir
      CHART_REGISTRY: registry.nscale.com/helm-charts
      TAG: ${{ needs.version.outputs.tag }}
      # One chart version per release, v-prefixed, as the base layer pins.
      HELM_CHART_VERSION: ${{ needs.version.outputs.tag }}
    steps:
      # To include the helm chart in the release artifact, we build and push it here instead of the separate job.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      # The Makefile runs Helm as `go tool -modfile=tools/go.mod helm`, so log in with the same binary, which
      # writes the credentials where its push reads them. The chart robot is this repository's own, with Pull
      # and Push on the helm-charts project: the org's HARBOR_GHCR_ROBOT_* secrets are not shared with public
      # repositories, and the image robot has no access to helm-charts.
      - name: Log in to Harbor for charts
        env:
          HELM_OCI_USERNAME: ${{ secrets.HARBOR_CHART_ROBOT_USERNAME }}
          HELM_OCI_PASSWORD: ${{ secrets.HARBOR_CHART_ROBOT_SECRET }}
        run: echo "$HELM_OCI_PASSWORD" | go tool -modfile=tools/go.mod helm registry login registry.nscale.com --username "$HELM_OCI_USERNAME" --password-stdin

      - name: Point the chart at the fork's images
        run: hack/nscale/set-chart-images.sh "${IMAGE_REGISTRY}/ai-gateway"

      - name: Package Helm charts
        run: make helm-package

      - name: Push Helm charts
        run: |
          hack/nscale/push-charts.sh "oci://${CHART_REGISTRY}" "${HELM_CHART_VERSION}" \
            "./out/ai-gateway-crds-helm-${HELM_CHART_VERSION}.tgz" \
            "./out/ai-gateway-helm-${HELM_CHART_VERSION}.tgz"

      - name: Build CLI release binaries
        run: |
          make build.aigw GOOS_LIST="linux" GOARCH_LIST="amd64 arm64"
          # amd64 for macos is not available on archive-envoy for the last few table versions
          # which in turn is used by EG's standalone mode used by aigw, so we skip it
          make build.aigw GOOS_LIST="darwin" GOARCH_LIST="arm64"

      # The release attaches to the pushed nscale/ tag; --verify-tag stops gh creating a bare v* tag on main.
      # gh creates the release before uploading its assets, so a failed upload leaves a release missing some.
      # A re-run uploads only the assets not already uploaded, never replacing one, and stops on any lookup
      # error other than not found.
      - name: Create a draft release
        run: |
          set -euo pipefail
          assets=("./out/ai-gateway-crds-helm-${TAG}.tgz" "./out/ai-gateway-helm-${TAG}.tgz" ./out/aigw-*)
          if uploaded="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[] | select(.state == "uploaded") | .name' 2>&1)"; then
            missing=()
            for asset in "${assets[@]}"; do
              grep -qxF "$(basename "$asset")" <<<"$uploaded" || missing+=("$asset")
            done
            if ((${#missing[@]} == 0)); then
              echo "Release $GITHUB_REF_NAME already has every asset; skipping"
              exit 0
            fi
            # --clobber only replaces an asset whose earlier upload did not complete.
            gh release upload "$GITHUB_REF_NAME" --clobber "${missing[@]}"
            exit 0
          fi
          if [[ "$uploaded" != "release not found" ]]; then
            echo "::error::cannot tell whether release $GITHUB_REF_NAME exists: $uploaded"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "$TAG" --notes "To be written by the release manager" "${assets[@]}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
