name: Docker Build Job

on:
  workflow_call:
    inputs:
      tag:
        description: Image tag to push, e.g. v1.2.0-nscale.1. release.yaml validates it.
        required: true
        type: string

jobs:
  docker_builds:
    name: ${{ matrix.command_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # The Nscale fork publishes to the envir project on Harbor instead of docker.io/envoyproxy.
      OCI_REGISTRY: registry.nscale.com/envir
      # The source label links each image to this repository; the revision label records the commit it was built
      # from, which the "Check for a published image" step compares against.
      DOCKER_PUSH_ARGS: >-
        --push
        --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
        --label org.opencontainers.image.revision=${{ github.sha }}
        --annotation index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
        --annotation index:org.opencontainers.image.revision=${{ github.sha }}
    strategy:
      matrix:
        # Only the images the ai-gateway-helm chart deploys; the fork does not publish aigw or the test images.
        include:
          - command_name: "controller"
            cmd_path_prefix: cmd
          - command_name: "extproc"
            cmd_path_prefix: cmd
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v5
        with:
          cache: false
          go-version-file: go.mod
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/golangci-lint
            ~/go/pkg/mod
            ~/go/bin
          key: build-container-${{ hashFiles('**/go.mod', '**/go.sum', '**/Makefile') }}

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker buildx
        id: buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login into Harbor
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: registry.nscale.com
          username: ${{ secrets.RELEASE_IMAGE_REGISTRY_USERNAME }}
          password: ${{ secrets.RELEASE_IMAGE_REGISTRY_PASSWORD }}

      # Harbor overwrites a tag on push, so nothing already published is pushed again. A tag already published
      # from this commit is skipped, so a re-run finishes a partial publish; one published from another commit,
      # or a registry error, stops the run.
      - name: Check for a published image
        id: published
        env:
          IMAGE: ${{ env.OCI_REGISTRY }}/ai-gateway-${{ matrix.command_name }}:${{ inputs.tag }}
        run: |
          set -uo pipefail
          if out="$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Image}}' 2>&1)"; then
            # .Image is a map of platform to image config for a multi-platform index, one config otherwise.
            revision="$(jq -r '(if has("config") then [.] else [.[]] end) | [.[].config.Labels["org.opencontainers.image.revision"] // empty] | unique | join(",")' <<<"$out")"
            if [[ "$revision" == "$GITHUB_SHA" ]]; then
              echo "$IMAGE is already published from $GITHUB_SHA; skipping"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "::error::$IMAGE is already published from ${revision:-an unknown commit}"; exit 1
          fi
          if grep -qiE 'not found|manifest unknown|name unknown' <<<"$out"; then echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "::error::cannot tell whether $IMAGE is published: $out"; exit 1

      # Build for both amd64 and arm64 platforms.
      - name: Build and Push Image
        if: steps.published.outputs.skip != 'true'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          make docker-build.${{ matrix.command_name }} CMD_PATH_PREFIX=${{ matrix.cmd_path_prefix }} ENABLE_MULTI_PLATFORMS=true TAG="$TAG" DOCKER_BUILD_ARGS="${DOCKER_PUSH_ARGS}"
