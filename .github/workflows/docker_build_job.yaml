name: Docker Build Job

on:
  workflow_call:
    inputs:
      tag:
        description: Additional tag to push, e.g. a GitVersion-computed -dev version. Skipped if empty.
        required: false
        type: string

jobs:
  docker_builds:
    name: ${{ matrix.command_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # The Nscale fork publishes to the repository's GHCR namespace instead of docker.io/envoyproxy.
      OCI_REGISTRY: ghcr.io/nscaledev
      # The source label links each package to this repository; the revision label records the commit it was built from.
      DOCKER_PUSH_ARGS: >-
        --push
        --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
        --label org.opencontainers.image.revision=${{ github.sha }}
        --annotation index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
        --annotation index:org.opencontainers.image.revision=${{ github.sha }}
    strategy:
      matrix:
        # Only the images the ai-gateway-helm chart deploys; the fork does not publish aigw or the test images.
        include:
          - command_name: "controller"
            cmd_path_prefix: cmd
          - command_name: "extproc"
            cmd_path_prefix: cmd
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v5
        with:
          cache: false
          go-version-file: go.mod
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/golangci-lint
            ~/go/pkg/mod
            ~/go/bin
          key: build-container-${{ hashFiles('**/go.mod', '**/go.sum', '**/Makefile') }}

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker buildx
        id: buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login into GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push images for the push events, e.g. when a new tag is pushed as well as PR merges.
      # * Only use the tag if the event is a tag event, otherwise use the hash.
      # * Build for both amd64 and arm64 platforms.
      - name: Build and Push Image
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${{ github.sha }}"
          fi
          make docker-build.${{ matrix.command_name }} CMD_PATH_PREFIX=${{ matrix.cmd_path_prefix }} ENABLE_MULTI_PLATFORMS=true TAG=$TAG DOCKER_BUILD_ARGS="${DOCKER_PUSH_ARGS}"

      - name: Build and Push Image Latest
        run: |
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            make docker-build.${{ matrix.command_name }} CMD_PATH_PREFIX=${{ matrix.cmd_path_prefix }} ENABLE_MULTI_PLATFORMS=true TAG="latest" DOCKER_BUILD_ARGS="${DOCKER_PUSH_ARGS}"
          fi

      # inputs.tag is the GitVersion-computed -dev version, additional to the SHA tag above
      # which remains the documented way to pin to a specific commit.
      - name: Build and Push Image Dev Version
        if: ${{ inputs.tag != '' }}
        run: |
          make docker-build.${{ matrix.command_name }} CMD_PATH_PREFIX=${{ matrix.cmd_path_prefix }} ENABLE_MULTI_PLATFORMS=true TAG=${{ inputs.tag }} DOCKER_BUILD_ARGS="${DOCKER_PUSH_ARGS}"
