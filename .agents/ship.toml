# Ship workflow overlay for nscaledev/agent-router.
#
# Only justified differences from the plugin's defaults.toml live here; every
# omitted key takes the default. See the ship skill's references/setup.md.

# CI runs `make check` (precommit_check.yaml) and `make test-coverage`
# (build_and_test.yaml, with -race). `make check` is `make precommit` followed
# by a clean-tree check, which fails on any uncommitted change, so the gate uses
# `make precommit` itself: the gate runs before implement commits. Left out:
# CI's -race flag, and the test-crdcel, test-controller, test-data-plane* and
# test-e2e* jobs, which need envtest, a local Envoy or a kind cluster.
#
# This gate rewrites files: precommit runs tidy, codegen, apidoc and the
# formatters. Stage only rewritten files inside the plan's scope and revert the
# rest, per the implement node.
check = "make precommit && make test-coverage"

# Runs ai-gateway's live-cluster suite (scripts/test-k8s-integ.sh) on the
# ai-services-atlas stack, with this checkout's chart and images as its Envoy
# AI Gateway, through the atlas's e2e runner, which writes the e2e-result.json
# contract. Lives under .agents/skills, as nscale-environments' does.
e2e_skill = ".agents/skills/e2e-tests/SKILL.md"

# Deliberately omitted:
#   [nodes.*] - the default routing fits: the orchestrator implements Go and
#               chart changes inline, and the toolchain needs no writable cache
#               root outside the workspace.
